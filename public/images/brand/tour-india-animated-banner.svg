<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
<title id="title">Tour India — Discover and plan travel across India</title>
<desc id="desc">An animated Indian travel panorama with layered mountains, palace and temple architecture, a rotating globe, floating hot-air balloon, stars and moving train.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07121f"/><stop offset=".5" stop-color="#123d49"/><stop offset="1" stop-color="#1c6870"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff4c5" stop-opacity=".95"/><stop offset=".4" stop-color="#ffd47c" stop-opacity=".5"/><stop offset="1" stop-color="#f4a53d" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ae"/><stop offset=".5" stop-color="#f6c85f"/><stop offset="1" stop-color="#e99a35"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2d093"/><stop offset="1" stop-color="#98603d"/></linearGradient>
 <radialGradient id="globe" cx=".3" cy=".25" r=".8"><stop stop-color="#91e5df"/><stop offset=".5" stop-color="#21818c"/><stop offset="1" stop-color="#073344"/></radialGradient>
 <linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0b2"/><stop offset=".5" stop-color="#e7a94c"/><stop offset="1" stop-color="#9d4d27"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="globeClip"><circle cx="1090" cy="112" r="49"/></clipPath>
</defs>
<style>
 .cloud{animation:cloud 32s ease-in-out infinite alternate}.cloud2{animation:cloud 40s ease-in-out infinite alternate-reverse}
 .float{animation:float 6s ease-in-out infinite}.balloon{transform-origin:1140px 165px;animation:balloon 8s ease-in-out infinite}
 .globeSpin{transform-origin:1090px 112px;animation:spin 24s linear infinite}.orbit{transform-origin:1090px 112px;animation:spin 13s linear infinite reverse}
 .train{animation:train 21s linear infinite}.twinkle{animation:twinkle 3s ease-in-out infinite}.pulse{animation:pulse 6s ease-in-out infinite}.water{animation:water 5s ease-in-out infinite}
 @keyframes cloud{to{transform:translateX(80px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px) rotate(2deg)}}
 @keyframes balloon{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(3deg)}}@keyframes spin{to{transform:rotate(360deg)}}
 @keyframes train{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}@keyframes twinkle{50%{opacity:.15}}@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}@keyframes water{50%{opacity:.9}}
 @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
