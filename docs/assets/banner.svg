<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Tour India: discover and plan travel across India">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031217"/>
      <stop offset="0.55" stop-color="#0b3540"/>
      <stop offset="1" stop-color="#14505c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.6" stop-color="#f2a33c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8890c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="1" stop-color="#f2a33c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#031217" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#031217" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .drift{animation:drift 20s ease-in-out infinite alternate}
    .drift2{animation:drift 28s ease-in-out infinite alternate-reverse}
    .float{animation:float 6s ease-in-out infinite}
    .twinkle{animation:twinkle 3.2s ease-in-out infinite}
    .train{animation:train 16s linear infinite}
    .glow{animation:glow 6s ease-in-out infinite}
    @keyframes drift{to{transform:translateX(70px)}}
    @keyframes float{50%{transform:translate(0,-12px) rotate(4deg)}}
    @keyframes twinkle{50%{opacity:.15}}
    @keyframes train{from{transform:translateX(-280px)}to{transform:translateX(1320px)}}
    @keyframes glow{50%{opacity:.6}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle class="twinkle" cx="640" cy="46" r="1.8"/>
    <circle class="twinkle" style="animation-delay:1s" cx="760" cy="96" r="1.4"/>
    <circle class="twinkle" style="animation-delay:2s" cx="880" cy="36" r="1.6"/>
    <circle class="twinkle" style="animation-delay:.6s" cx="1180" cy="70" r="1.8"/>
    <circle class="twinkle" style="animation-delay:1.6s" cx="1230" cy="150" r="1.3"/>
  </g>
  <circle class="glow" cx="1010" cy="170" r="130" fill="url(#sun)"/>
  <g class="drift" fill="#d6eef2" opacity=".16">
    <ellipse cx="700" cy="130" rx="90" ry="16"/>
    <ellipse cx="750" cy="118" rx="50" ry="16"/>
  </g>
  <g class="drift2" fill="#d6eef2" opacity=".1">
    <ellipse cx="900" cy="84" rx="80" ry="12"/>
  </g>
  <g class="float" transform="translate(1150 80)">
    <path d="M0 0 24 30 0 62 -24 30Z" fill="#f2a33c"/>
    <path d="M0 0 24 30 0 30Z" fill="#ffffff" opacity=".28"/>
    <path d="M0 0V62M-24 30H24" stroke="#00000055" stroke-width="1.5"/>
    <path d="M0 62c-7 9 7 15 0 24s7 13 0 18" fill="none" stroke="#d81b60" stroke-width="2.2"/>
  </g>
  <path d="M560 320 L690 236 L780 290 L890 214 L1010 300 L1130 250 L1280 296 V340 H560Z" fill="#0a2d35"/>
  <g fill="#072128">
    <path d="M700 340v-56h14v-20l11-16 11 16v20h14v56z"/>
    <rect x="790" y="270" width="80" height="70"/>
    <path d="M798 270q32-46 64 0z"/>
    <rect x="826" y="214" width="8" height="12"/>
    <rect x="774" y="246" width="9" height="94"/>
    <rect x="877" y="246" width="9" height="94"/>
    <path d="M920 340v-68h70v68h-18v-34q-17-22-34 0v34z"/>
    <path d="M1030 340v-44l20-26 20 26v44z"/>
  </g>
  <g class="train">
    <rect x="0" y="330" width="76" height="22" rx="5" fill="#f7d774"/>
    <rect x="80" y="332" width="64" height="20" rx="4" fill="#f2a33c"/>
    <rect x="148" y="332" width="64" height="20" rx="4" fill="#f2a33c"/>
    <g fill="#031217"><circle cx="18" cy="354" r="4.5"/><circle cx="58" cy="354" r="4.5"/><circle cx="98" cy="354" r="4.5"/><circle cx="126" cy="354" r="4.5"/><circle cx="166" cy="354" r="4.5"/><circle cx="194" cy="354" r="4.5"/></g>
  </g>
  <rect y="356" width="1280" height="4" fill="#f7d774" opacity=".4"/>
  <rect y="360" width="1280" height="40" fill="#031217"/>
  <rect width="1280" height="400" fill="url(#fade)"/>
  <text x="72" y="150" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="700" fill="url(#gold)">Tour India</text>
  <text x="76" y="206" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#eef7f8">Discover and plan travel across India</text>
  <text x="76" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#9fd3dc">36 states and UTs · 52 destination guides · festivals · food · trip planner</text>
</svg>
