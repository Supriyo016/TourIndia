<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
<title id="title">Tour India — Discover and plan travel across India</title>
<desc id="desc">A moving travel scene with a luminous globe, stylised map of India, orbital route, flying aircraft, hot-air balloon, Taj Mahal silhouette and a passing train.</desc>
<defs>
  <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#061820"/><stop offset=".52" stop-color="#0b3540"/><stop offset="1" stop-color="#14505c"/></linearGradient>
  <radialGradient id="haze"><stop stop-color="#4bb8ad" stop-opacity=".36"/><stop offset="1" stop-color="#4bb8ad" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b0"/><stop offset=".48" stop-color="#f5cf70"/><stop offset="1" stop-color="#dd8d35"/></linearGradient>
  <linearGradient id="globe" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#c9fff0"/><stop offset=".22" stop-color="#329e9c"/><stop offset=".7" stop-color="#12616e"/><stop offset="1" stop-color="#062532"/></linearGradient>
  <radialGradient id="shine" cx=".25" cy=".18" r=".8"><stop stop-color="#fff" stop-opacity=".72"/><stop offset=".34" stop-color="#d7fff5" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="shade" x2="1"><stop stop-color="#03151e" stop-opacity="0"/><stop offset=".68" stop-color="#03151e" stop-opacity=".08"/><stop offset="1" stop-color="#03151e" stop-opacity=".72"/></linearGradient>
  <linearGradient id="hills" y2="1"><stop stop-color="#28747a"/><stop offset="1" stop-color="#082b35"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#ffe2a0" stop-opacity=".7"/><stop offset="1" stop-color="#eea93f" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sphere"><circle cx="1002" cy="181" r="103"/></clipPath>
</defs>
<style>
  .cloud1{animation:cloud 32s ease-in-out infinite alternate}
  .cloud2{animation:cloud 42s ease-in-out -12s infinite alternate-reverse}
  .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
  .float2{transform-box:fill-box;transform-origin:center;animation:float 7s ease-in-out -2s infinite}
  .spin{transform-box:view-box;transform-origin:1002px 181px;animation:spin 28s linear infinite}
  .orbit{transform-box:view-box;transform-origin:1002px 181px;animation:orbit 17s linear infinite}
  .train{animation:train 18s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
  .stars{animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes cloud{to{transform:translateX(65px)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes orbit{to{transform:rotate(-360deg)}}
  @keyframes train{from{transform:translateX(-280px)}to{transform:translateX(1400px)}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}
  @keyframes twinkle{to{opacity:.2}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<rect width="1280" height="400" fill="url(#sky)"/>
<rect width="1280" height="400" fill="url(#haze)"/>
<circle cx="1030" cy="175" r="205" fill="url(#sun)"/>
<g fill="#fff" class="stars">
  <circle cx="642" cy="44" r="1.8"/><circle cx="765" cy="86" r="1.4"/><circle cx="884" cy="39" r="1.5"/>
  <circle cx="1185" cy="66" r="1.8"/><circle cx="1230" cy="151" r="1.3"/><circle cx="708" cy="169" r="1.5"/>
  <path d="m850 118 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#ffe7a3"/>
</g>
<g class="cloud1" fill="#d8f4f0" opacity=".12"><ellipse cx="652" cy="115" rx="76" ry="13"/><ellipse cx="692" cy="103" rx="52" ry="16"/><ellipse cx="733" cy="115" rx="61" ry="11"/></g>
<g class="cloud2" fill="#d8f4f0" opacity=".1"><ellipse cx="927" cy="75" rx="75" ry="11"/><ellipse cx="970" cy="64" rx="44" ry="14"/><ellipse cx="1008" cy="76" rx="57" ry="10"/></g>

<!-- Layered hills and a Taj Mahal-inspired silhouette -->
<path d="M530 319 675 254 759 294 846 220 934 286 1012 240 1100 287 1182 249 1280 291V360H530Z" fill="url(#hills)" opacity=".72"/>
<path d="M640 338 754 281 838 320 923 274 1006 321 1092 278 1171 321 1280 286V363H640Z" fill="#082e39"/>
<g transform="translate(758 261)" opacity=".7" filter="url(#shadow)" fill="#061f2a">
  <path d="M0 82V39H16V82M-7 39H23L8 24Z M31 82V50H44V82M27 50H48L38 36Z"/>
  <path d="M15 82V45H116V82Z M26 45Q65-6 105 45Z M61 16Q65-3 69 16V29H61Z"/>
  <path d="M54 82V60Q65 43 76 60V82Z"/>
  <path d="M15 45H116M7 82H125" stroke="#f4c96e" stroke-opacity=".32" stroke-width="1.5"/>
</g>

<!-- Volumetric globe with rotating longitude and latitude -->
<g filter="url(#shadow)">
  <circle cx="1002" cy="181" r="130" fill="#42c7b6" opacity=".12" filter="url(#glow)"/>
  <circle cx="1002" cy="181" r="111" fill="#082b36" stroke="#f3cc70" stroke-opacity=".65" stroke-width="1.5"/>
  <circle cx="1002" cy="181" r="103" fill="url(#globe)"/>
  <g clip-path="url(#sphere)">
    <g class="spin" fill="none" stroke="#d7fff4" stroke-opacity=".28">
      <ellipse cx="1002" cy="181" rx="86" ry="103" stroke-width="1.3"/>
      <ellipse cx="1002" cy="181" rx="47" ry="103" stroke-width="1.1"/>
      <path d="M899 181H1105M910 143Q1002 174 1094 143M910 220Q1002 190 1094 220M919 113Q1002 150 1085 113M919 249Q1002 212 1085 249"/>
    </g>
    <path d="m970 108 20-6 16 8 10 12 15 5 8 14-9 11 5 12-12 13-4 17-10 12-4 18-11 20-10-16-4-18-12-15-6-18-10-14 6-16-7-13Z"
      fill="#f1c96f" stroke="#fff1bd" stroke-width="2" stroke-linejoin="round"/>
    <path d="M1008 226q13 9 12 22-10 9-16-3Z" fill="#f1c96f" stroke="#fff1bd" stroke-width="1.2"/>
    <path d="m976 120 26-3 19 17m-58 24 42 7 23-13m-48 40 38 6" fill="none" stroke="#fff8d9" stroke-opacity=".38" stroke-width="1.2"/>
    <circle cx="1009" cy="161" r="3" fill="#fff8d9"/>
    <rect x="895" y="75" width="215" height="215" fill="url(#shine)"/>
    <rect x="895" y="75" width="215" height="215" fill="url(#shade)"/>
  </g>
  <circle cx="1002" cy="181" r="103" fill="none" stroke="#d7fff4" stroke-opacity=".55"/>
  <path d="M932 117Q963 86 1006 83" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- Rotating orbital path and glowing travel beacons -->
<g class="orbit" fill="none">
  <ellipse cx="1002" cy="181" rx="151" ry="54" transform="rotate(-20 1002 181)" stroke="#f5d17a" stroke-width="2" stroke-opacity=".78" stroke-dasharray="7 8"/>
  <ellipse cx="1002" cy="181" rx="151" ry="54" transform="rotate(-20 1002 181)" stroke="#9ce8dc" stroke-width="7" stroke-opacity=".09"/>
  <circle cx="1143" cy="128" r="5.5" fill="#fff0b0" filter="url(#glow)"/>
  <circle cx="861" cy="233" r="4.5" fill="#65e2d1" filter="url(#glow)"/>
</g>
<g class="float" transform="translate(1009 153)">
  <path d="M0 0C-13 0-22 10-22 22c0 17 22 39 22 39s22-22 22-39C22 10 13 0 0 0Z" fill="url(#gold)" stroke="#fff3c5" stroke-width="1.4"/>
  <circle cy="21" r="7" fill="#14505c" stroke="#fff7d8" stroke-width="2"/><circle cy="21" r="2.4" fill="#fff"/>
</g>
<circle class="pulse" cx="1009" cy="174" r="17" fill="none" stroke="#ffe7a0" stroke-width="1.6"/>

<!-- Airplane and hot-air balloon -->
<g class="float" transform="translate(1126 91) rotate(-16)">
  <path d="m0 0 42 12-25 7-7 16-6-1 3-16-15-4Z" fill="url(#gold)" stroke="#fff2c3" stroke-width="1.1"/>
</g>
<g class="float2" transform="translate(1180 160)">
  <path d="M0-27C-18-27-25-8-19 7-14 19-5 26 0 29 5 26 14 19 19 7 25-8 18-27 0-27Z" fill="url(#gold)" stroke="#fff0b8" stroke-width="1.3"/>
  <path d="M0-25V25M-14-18Q0 0 0 24M14-18Q0 0 0 24" fill="none" stroke="#9c5d2b" stroke-opacity=".5" stroke-width="1.2"/>
  <path d="M-5 30H5L3 36H-3Z" fill="#f3bf62"/>
</g>

<!-- Title and travel-guide details -->
<rect width="780" height="360" fill="#061820" opacity=".12"/>
<path d="M76 82H151" stroke="#f5d17a" stroke-width="3" stroke-linecap="round"/><circle cx="160" cy="82" r="3" fill="#f5d17a"/>
<text x="72" y="158" font-family="Georgia,'Times New Roman',serif" font-size="91" font-weight="700" letter-spacing="-2.5" fill="url(#gold)">Tour India</text>
<text x="77" y="210" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="500" fill="#f1fbfa">Discover and plan travel across India</text>
<text x="78" y="255" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#a9d9d7">36 states &amp; UTs · 52 destination guides · culture · trip planner</text>
<g transform="translate(78 292)">
  <rect width="215" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#9ce5de" stroke-opacity=".45"/>
  <circle cx="17" cy="17" r="4" fill="#f5d17a"/>
  <text x="31" y="22.5" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.1" fill="#e8f8f4">EXPLORE INCREDIBLE INDIA</text>
</g>

<!-- Animated Indian train -->
<path d="M0 351Q270 347 520 353T1280 350" fill="none" stroke="#7bc7bd" stroke-opacity=".25" stroke-width="2"/>
<g class="train" filter="url(#shadow)">
  <path d="M0 328Q0 319 10 319H73Q84 319 84 330V350H0Z" fill="url(#gold)" stroke="#fff0b6"/>
  <path d="M84 329H147V350H84Z" fill="#eaa94e" stroke="#fff0b6" stroke-opacity=".65"/>
  <path d="M151 329H214V350H151Z" fill="#d98e3e" stroke="#fff0b6" stroke-opacity=".55"/>
  <path d="M11 324H31V338H11ZM39 324H60V338H39Z" fill="#164753"/>
  <path d="M94 333H109V341H94ZM119 333H134V341H119ZM161 333H176V341H161ZM186 333H201V341H186Z" fill="#164753"/>
  <path d="M0 346H214" stroke="#fff1c0" stroke-opacity=".6"/>
  <g fill="#061820" stroke="#f8d774" stroke-width="1"><circle cx="20" cy="352" r="5.2"/><circle cx="64" cy="352" r="5.2"/><circle cx="106" cy="352" r="4.7"/><circle cx="135" cy="352" r="4.7"/><circle cx="174" cy="352" r="4.7"/><circle cx="201" cy="352" r="4.7"/></g>
</g>
<rect y="360" width="1280" height="3" fill="url(#gold)" opacity=".65"/>
<rect y="363" width="1280" height="37" fill="#04171f"/>
<path d="M0 363H1280" stroke="#b2e5dc" stroke-opacity=".15"/>
<circle class="stars" cx="74" cy="382" r="1.5" fill="#f8d774"/><circle class="stars" cx="1200" cy="382" r="1.4" fill="#65d4c6"/>
</svg>