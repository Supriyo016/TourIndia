name: Bug report
description: Something on the site doesn't work as expected
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page address
      placeholder: https://tour-india-pi.vercel.app/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ..."
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Pixel 8, Chrome 141
